[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "yield-curves"
version = "0.1.0"
description = "Transparent construction, calibration, and validation of interest-rate curves for financial valuation."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
license-files = ["LICENSE"]

authors = [
    { name = "Luis Gerardo Canales Ocampo" }
]

keywords = [
    "yield-curves",
    "fixed-income",
    "interest-rates",
    "ois",
    "f-tiie",
    "bootstrapping",
    "valuation",
    "financial-engineering"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Mathematics"
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.11.4"
]


[project.urls]
Repository = "https://github.com/LuisGCanales/financial-implementations"
Documentation = "https://github.com/LuisGCanales/financial-implementations/tree/main/fixed-income/yield-curves/docs"
Issues = "https://github.com/LuisGCanales/financial-implementations/issues"


[project.optional-dependencies]
dev = [
    "pytest>=8.0"
]

plots = [
    "matplotlib>=3.7"
]


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
markers = [
    "slow: expensive repeated recalibration or research-scale numerical work",
]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers"
]
