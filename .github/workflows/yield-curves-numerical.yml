name: Yield curves numerical
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full 40-character commit SHA to run with the slow marker
        required: true
        type: string
concurrency:
  group: yield-curves-numerical
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: '1'
      TMPDIR: ${{ runner.temp }}/yield-curves/tmp
      MPLCONFIGDIR: ${{ runner.temp }}/yield-curves/matplotlib
      XDG_CACHE_HOME: ${{ runner.temp }}/yield-curves/cache
      SELECTED_REVISION: ${{ inputs.revision }}
    steps:
      - name: Validate selected revision
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SELECTED_REVISION" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4; verified GitHub tag ref
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify checked-out revision
        shell: bash
        run: |
          set -euo pipefail
          [[ $(git rev-parse HEAD) == "$SELECTED_REVISION" ]]
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5; verified GitHub tag ref
        with:
          python-version: '3.11.15'
      - name: Install reproducible development dependencies
        working-directory: fixed-income/yield-curves
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$TMPDIR" "$MPLCONFIGDIR" "$XDG_CACHE_HOME" "$RUNNER_TEMP/yield-curves/results"
          python -m pip install --require-hashes --only-binary=:all: \
            -r requirements/ci-reference.txt -r requirements/development-build.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Record source and environment
        working-directory: fixed-income/yield-curves
        shell: bash
        run: |
          set -euo pipefail
          {
            git rev-parse HEAD
            git rev-parse HEAD:fixed-income/yield-curves
            python --version
            python -m pip freeze --all
          } > "$RUNNER_TEMP/yield-curves/results/environment.txt"
      - name: Run expensive numerical tests in one serial session
        working-directory: fixed-income/yield-curves
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -s -vv -m slow --durations=20 \
            --junitxml="$RUNNER_TEMP/yield-curves/results/tests.xml" \
            2>&1 | tee "$RUNNER_TEMP/yield-curves/results/pytest.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4; verified GitHub tag ref
        if: always()
        with:
          name: yield-curves-numerical-${{ github.run_attempt }}
          path: ${{ runner.temp }}/yield-curves/results/
          if-no-files-found: error
          retention-days: 30
