name: Yield curves PR
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: yield-curves-pr-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.scope.outputs.relevant }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4; verified GitHub tag ref
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        name: Prove monorepo scope
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yield-curves-scope"
          python3 - <<'PYCODE'
          import json, os, pathlib, re, subprocess
          event=json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          kind=os.environ['GITHUB_EVENT_NAME']
          reason='complete Git diff'
          if kind=='workflow_dispatch':
              relevant=True; reason='manual validation'
          else:
              if kind=='pull_request':
                  base=event['pull_request']['base']['sha']; head=event['pull_request']['head']['sha']
              elif kind=='push':
                  base=event['before']; head=event['after']
              else:
                  raise ValueError('unknown scope event')
              assert all(re.fullmatch('[0-9a-f]{40}', x) for x in (base,head))
              if base=='0'*40:
                  relevant=True; reason='first push; conservatively relevant'
              else:
                  paths=subprocess.check_output(['git','diff','--no-renames','--name-only','-z',base,head]).decode().split('\0')
                  relevant=any(p.startswith(('fixed-income/yield-curves/','.github/workflows/')) for p in paths)
          proof=dict(event=kind,relevant=relevant,reason=reason)
          pathlib.Path(os.environ['RUNNER_TEMP'],'yield-curves-scope','scope.json').write_text(json.dumps(proof,indent=2)+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a') as out: out.write('relevant='+str(relevant).lower()+'\n')
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4; verified GitHub tag ref
        if: always()
        with:
          name: yield-curves-scope-${{ github.run_attempt }}
          path: ${{ runner.temp }}/yield-curves-scope/
          if-no-files-found: error
          retention-days: 14
  validate:
    needs: scope
    if: needs.scope.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4; verified GitHub tag ref
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5; verified GitHub tag ref
        with:
          python-version: '3.11.15'
      - name: Initialize runner temp paths
        shell: bash
        run: |
          set -euo pipefail

          BASE="$RUNNER_TEMP/yield-curves"

          mkdir -p \
            "$BASE/tmp" \
            "$BASE/matplotlib" \
            "$BASE/cache" \
            "$BASE/results"

          {
            echo "TMPDIR=$BASE/tmp"
            echo "MPLCONFIGDIR=$BASE/matplotlib"
            echo "XDG_CACHE_HOME=$BASE/cache"
          } >> "$GITHUB_ENV"
      - name: Install reproducible development dependencies
        working-directory: fixed-income/yield-curves
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --only-binary=:all: \
            -r requirements/ci-reference.txt -r requirements/development-build.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Record source and environment
        working-directory: fixed-income/yield-curves
        shell: bash
        run: |
          set -euo pipefail
          {
            git rev-parse HEAD
            git rev-parse HEAD:fixed-income/yield-curves
            python --version
            python -m pip freeze --all
          } > "$RUNNER_TEMP/yield-curves/results/environment.txt"
      - name: Run non-slow financial and unit tests
        working-directory: fixed-income/yield-curves
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -m 'not slow' \
            --junitxml="$RUNNER_TEMP/yield-curves/results/tests.xml" \
            2>&1 | tee "$RUNNER_TEMP/yield-curves/results/pytest.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4; verified GitHub tag ref
        if: always()
        with:
          name: yield-curves-tests-${{ github.run_attempt }}
          path: ${{ runner.temp }}/yield-curves/results/
          if-no-files-found: error
          retention-days: 14
  required:
    name: yield-curves-required
    if: always()
    needs: [scope, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Fail closed on scope and validation
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          RELEVANT: ${{ needs.scope.outputs.relevant }}
          VALIDATION_RESULT: ${{ needs.validate.result }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SCOPE_RESULT" == success ]]
          case "$RELEVANT" in
            true) [[ "$VALIDATION_RESULT" == success ]] ;;
            false) [[ "$VALIDATION_RESULT" == skipped ]] ;;
            *) exit 1 ;;
          esac
