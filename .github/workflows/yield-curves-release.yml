name: Yield curves release
on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Full 40-character SHA of the approved commit
        required: true
        type: string
      expected_tree:
        description: Independently reviewed yield-curves subtree object SHA
        required: true
        type: string
      review_reference:
        description: Human review reference authorizing this exact SHA and tree
        required: true
        type: string
      expected_version:
        description: Expected distribution version
        required: true
        type: string
        default: '0.1.0'
concurrency:
  group: yield-curves-release-${{ github.run_id }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CANDIDATE_SHA: ${{ inputs.approved_sha }}
      EXPECTED_TREE: ${{ inputs.expected_tree }}
      EXPECTED_VERSION: ${{ inputs.expected_version }}
      REVIEW_REFERENCE: ${{ inputs.review_reference }}
      INTENT: TIER_C_ONLY
    steps:
      - name: Require explicit immutable candidate review
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_TREE" =~ ^[0-9a-f]{40}$ && -n "$REVIEW_REFERENCE" ]]
          [[ "$EXPECTED_VERSION" == 0.1.0 ]]
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4; verified GitHub tag ref
        with:
          ref: ${{ inputs.approved_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5; verified GitHub tag ref
        with:
          python-version: '3.11.15'
      - name: Run Tier C once
        shell: bash
        run: |
          set -euo pipefail
          [[ $(git rev-parse HEAD) == "$CANDIDATE_SHA" ]]
          bash fixed-income/yield-curves/scripts/release/run_release_validation.sh \
            --repo "$GITHUB_WORKSPACE" --revision "$CANDIDATE_SHA" \
            --expected-tree "$EXPECTED_TREE" --expected-version "$EXPECTED_VERSION" \
            --external-root "$RUNNER_TEMP/yield-curves-c" \
            --approval "$REVIEW_REFERENCE" --tier C
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4; verified GitHub tag ref
        if: always()
        with:
          name: yield-curves-tier-c-${{ github.run_attempt }}
          path: ${{ runner.temp }}/yield-curves-c/public/
          if-no-files-found: error
          retention-days: 30
